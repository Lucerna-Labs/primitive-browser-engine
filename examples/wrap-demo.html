<html>
  <body>
    <style>
      .narrow  { width: 220px; background-color: #eef2f7; }
      .wide    { width: 720px; background-color: #eef2f7; }
      h1       { color: #0b3d91; }
      p        { color: #222222; }
    </style>
    <h1>Wrap demo</h1>
    <div class="narrow">
      <p>The quick brown fox jumps over the lazy dog again and again and again to force real line wrapping inside a narrow container.</p>
    </div>
    <h1>Same paragraph, wide container</h1>
    <div class="wide">
      <p>The quick brown fox jumps over the lazy dog again and again and again to force real line wrapping inside a narrow container.</p>
    </div>
  </body>
</html>
