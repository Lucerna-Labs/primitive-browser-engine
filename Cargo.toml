[workspace]
resolver = "2"
members = [
    "crates/cap-http",
    "crates/cap-geometry",
    "crates/cap-text-shape",
    "crates/pbe-net",
    "crates/pbe-proto",
    "crates/pbe-proto-http",
    "crates/pbe-proto-ws",
    "crates/pbe-proto-data",
    "crates/pbe-img-codecs",
    "crates/pbe-text",
    "crates/pbe-orchestrator",
    "crates/pbe-shell",
    "crates/pmre-core",
    "crates/pmre-raster",
    "crates/pmre-text",
    "crates/pmre-layout",
    "crates/pmre-html",
    "crates/pmre-kit",
    "crates/pmre-orchestrator",
    "crates/pmre-showcases",
]

# ---------------------------------------------------------------------------
# Primitive Browser Engine — a thin caller around a complete rendering kit.
#
# Doctrine (composition, not cracking):
#   - pmre-kit + pmre-orchestrator (vendored from the sibling
#     primitive-math-rendering-engine project) IS the renderer: math
#     primitives (the eight root atoms — scan/hash/fold/project/scale/
#     compare/combine/order) compose up into function primitives (box model,
#     flex layout, SDF/scanline paint, real TrueType text), and that
#     composition is already complete — `render_html` does parse + layout +
#     paint + raster in one call. It is not a disassembled kit of separate
#     steps needing an orchestrator wired around it; it is already the whole
#     thing. We never modify it in place here; changes land upstream (in
#     primitive-math-rendering-engine) and get re-copied.
#   - pbe-net (driving the sealed system `curl`) is the network on-ramp
#     primitive we compose over — also a complete, direct `url ->
#     Result<FetchedPage>` call, not a stage in a pipeline.
#   - THIS workspace is a thin caller: load a page, hand it to `render_html`,
#     present or persist the result. There is nothing here to orchestrate.
#
# History (2026-07-03): this workspace originally drove the F:\ cap-* kit
# (cap-html-parse/cap-css-parse/cap-style-cascade/cap-paint) via pbe-layout/
# pbe-render/pbe-svg/pbe-fuzzy, wired as strands over the Spiderweb bus
# (F:\Spiderweb-Bus-Next) — genuine orchestration, because that kit really
# was a disassembled set of separate steps (parse, cascade, paint, raster)
# that needed gluing together. That pipeline was retired in favor of
# vendoring primitive-math-rendering-engine (PMRE) directly.
#
# A second pass the same day corrected an over-carried-over mistake: the bus/
# strand/message-type ceremony (pbe-protocol, pbe-stages, the spider
# supervisor) was kept even after the switch to PMRE, wrapping an
# already-complete renderer in orchestration machinery built for gluing
# together disassembled parts it no longer had to glue. pbe-protocol and
# pbe-stages were deleted; pbe-orchestrator and pbe-shell now call
# `pbe_net::fetch` and `pmre_orchestrator::render_html`/`render_uxi` directly,
# synchronously, no bus in between. See ROADMAP.md.
# ---------------------------------------------------------------------------

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
# --- The network on-ramp's type contract (drive the sealed system curl) ---
cap-http = { path = "crates/cap-http" }

# --- Still used by pbe-text (kept — orphaned by the pipeline retirement, not
#     explicitly approved for removal, still builds/tests standalone) ---
cap-geometry = { path = "crates/cap-geometry" }
cap-text-shape = { path = "crates/cap-text-shape" }

# Dependencies used only by the small vendored capability contracts above.
smallvec = { version = "1.6", features = ["union"] }
thiserror = "2.0"

# --- Internal ---
pbe-net = { path = "crates/pbe-net" }

# --- The modular protocol layer (one crate per modern protocol) ---
# pbe-proto is the single dispatch point; each protocol (http, ws, data) lives
# in its own swappable crate behind it. See crates/pbe-proto/src/lib.rs.
pbe-proto = { path = "crates/pbe-proto" }
pbe-proto-http = { path = "crates/pbe-proto-http" }
pbe-proto-ws = { path = "crates/pbe-proto-ws" }
pbe-proto-data = { path = "crates/pbe-proto-data" }

pmre-core = { path = "crates/pmre-core" }
pmre-raster = { path = "crates/pmre-raster" }
pmre-kit = { path = "crates/pmre-kit" }
pmre-orchestrator = { path = "crates/pmre-orchestrator" }
# Image codec crates (JPEG/WebP/GIF) — one swappable crate, decodes to the
# kit's Image type. The in-kit BMP/PNG decoders stay zero-dep; these add the
# formats most real web images use, behind a modular boundary.
pbe-img-codecs = { path = "crates/pbe-img-codecs" }
