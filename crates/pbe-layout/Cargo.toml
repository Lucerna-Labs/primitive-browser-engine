[package]
name = "pbe-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Layout stage — mirrors the styled DOM into cap-layout (taffy) and computes real per-node box geometry. Composition over the kit; no layout math of its own beyond block/inline/flex mapping."

[dependencies]
cap-html-parse = { workspace = true }
cap-style-cascade = { workspace = true }
cap-layout = { workspace = true }
cap-geometry = { workspace = true }

[dev-dependencies]
cap-css-parse = { workspace = true }
